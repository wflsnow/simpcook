version: '3.8'

services:
  app:
    build: .
    container_name: simp-cook-api
    ports:
      - "8000:8000"
    environment:
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_BASE_URL=${QWEN_BASE_URL}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; import urllib.request; import urllib.error; try: urllib.request.urlopen('http://localhost:8000/docs').read(); except urllib.error.URLError: sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
      python scripts/init_db.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - simp-cook-network

